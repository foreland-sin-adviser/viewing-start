<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Claudeで手配を始める</title>
<!--
  内覧手配：Claude のデスクトップアプリを開く中継ページ v3（2026-10-28）
  お知らせメールのボタン → このページ（開いた瞬間にアプリを起動）→ デスクトップアプリに決まった文が入る
  ・入る文は「案件IDだけ差し替える決まった文」。?id= に案件ID（C- か T- で始まる）以外は受け付けない
  ・どこにもアクセスしない（台帳・メール・お客様の情報は扱わない）
  ・v2（Apps Script）からの変更：Gmail の「リダイレクトの警告」と、中継ページでもう1回押す手間をなくすため GitHub Pages に移した
-->
<style>
  :root { --ink:#1C2321; --sub:#4A5551; --accent:#D97757; --bg:#FFFFFF; --line:#E6E2DA; }
  @media (prefers-color-scheme: dark) { :root { --ink:#ECEAE4; --sub:#B7B3AA; --bg:#1E1F1D; --line:#3A3B38; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; line-height:1.7; }
  main { max-width:560px; margin:48px auto; padding:0 16px; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { margin:0 0 16px; }
  .btn { display:inline-block; background:var(--accent); color:#fff; padding:14px 26px; border-radius:8px; text-decoration:none; font-weight:bold; font-size:17px; }
  .note { color:var(--sub); font-size:13px; padding-left:18px; margin:20px 0 0; border-top:1px solid var(--line); padding-top:16px; }
  .note li { margin-bottom:6px; }
  .say { color:var(--ink); }
</style>
</head>
<body>
<main>
  <h1 id="title">内覧手配</h1>
  <p id="msg">Claude のアプリを開いています…</p>
  <p id="btnwrap"><a id="btn" class="btn" href="#">Claudeで開く</a></p>
  <ul class="note" id="notes">
    <li>アプリが開かないときは、上のボタンを押してください。</li>
    <li>「Claude を開きますか？」と出たら、「常に…開く」にチェックを入れてから「Claude を開く」を押すと、次からは出なくなります。</li>
    <li>文が2つ重なって入ったときは、1つ消してから送信してください。</li>
    <li>それでも開かないときは、Claude のアプリに次の文を貼ってください：<br><span class="say" id="say"></span></li>
  </ul>
</main>
<script>
(function () {
  var id = '';
  try { id = (new URLSearchParams(location.search).get('id') || '').trim(); } catch (e) {}
  var ok = /^[CT]-[0-9A-Za-z-]{1,20}$/.test(id);
  if (!ok) {
    document.getElementById('msg').textContent = '案件IDが正しくありません。お知らせメールのボタンからもう一度開いてください。';
    document.getElementById('btnwrap').style.display = 'none';
    document.getElementById('notes').style.display = 'none';
    return;
  }
  var say = '内覧手配を始めます。案件 ' + id + ' を手配台帳から読んで、手配開始の確認画面を出して。';
  var link = 'claude://claude.ai/new?q=' + encodeURIComponent(say);
  document.getElementById('title').textContent = '案件 ' + id;
  document.getElementById('btn').href = link;
  document.getElementById('say').textContent = say;

  // 開いた瞬間に1回だけアプリを起動する（再読み込みで文が重ならないよう、同じタブでは2回目から自動では開かない）
  var key = 'opened:' + id, done = false;
  try { done = sessionStorage.getItem(key) === '1'; } catch (e) {}
  if (done) {
    document.getElementById('msg').textContent = 'このページから一度アプリを開いています。もう一度開くときはボタンを押してください。';
    return;
  }
  try { sessionStorage.setItem(key, '1'); } catch (e) {}
  setTimeout(function () {
    location.href = link;
    setTimeout(function () {
      document.getElementById('msg').textContent = 'アプリが開いたら、このタブは閉じて大丈夫です。';
    }, 1500);
  }, 300);
})();
</script>
</body>
</html>
